services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      ZELA_FONTE: ${ZELA_FONTE:-/opt/zela/exemplos/reports_demo.csv}
      ZELA_SAIDA: /opt/zela/saida
    volumes:
      - ./runtime/airflow:/opt/airflow
      - ./zela_bigdata/dags:/opt/airflow/dags:ro
      - ./saida:/opt/zela/saida
      - ./zela_bigdata/exemplos:/opt/zela/exemplos:ro
    ports:
      - "127.0.0.1:8080:8080"
